<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="-20 -20 480 420"
     font-family="'Latin Modern Math','STIX Two Math','Cambria Math',serif">
  <defs>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-axis" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-dot" x="-100%" y="-100%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </radialGradient>
    <marker id="arr-axis" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5z" fill="#66aaff"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5z" fill="#fb923c"/>
    </marker>
    <marker id="arr-y" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5z" fill="#facc15"/>
    </marker>
    <style>
      .dl1 { stroke-dasharray:120 120; stroke-dashoffset:120; animation:draw 0.6s ease-out 0.4s forwards; }
      .dl2p{ stroke-dasharray:110 110; stroke-dashoffset:110; animation:draw 0.55s ease-out 1.1s forwards; }
      .dl2 { stroke-dasharray:85 85;  stroke-dashoffset:85;  animation:draw 0.45s ease-out 1.7s forwards; }
      .ddt { stroke-dasharray:58 58;  stroke-dashoffset:58;  animation:draw 0.4s ease-out 2.2s forwards; }
      @keyframes draw { to { stroke-dashoffset:0; } }
      .pop { transform-origin:center; transform-box:fill-box; transform:scale(0); opacity:0;
             animation:pop 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
      .pG{animation-delay:0.2s;} .pE{animation-delay:1.0s;}
      .pTp{animation-delay:1.6s;} .pT{animation-delay:2.1s;}
      @keyframes pop { to { transform:scale(1); opacity:1; } }
      .lbl { opacity:0; animation:fade 0.3s ease forwards; }
      .la{animation-delay:0.25s;} .lb{animation-delay:1.05s;}
      .lc{animation-delay:1.65s;} .ld{animation-delay:2.15s;}
      .le{animation-delay:2.5s;}  .lf{animation-delay:0.4s;}
      @keyframes fade { to { opacity:1; } }
      /* glow pulse */
      .p1 { animation: draw 0.6s ease-out 0.4s forwards, pb 2.4s 1.1s infinite; }
      .p2p{ animation: draw 0.55s ease-out 1.1s forwards, pb 2.4s 1.7s infinite; }
      .p2 { animation: draw 0.45s ease-out 1.7s forwards, po 2.4s 2.2s infinite; }
      .pdt{ animation: draw 0.4s ease-out 2.2s forwards, py 2.4s 2.7s infinite; }
      @keyframes pb { 0%,100%{opacity:0.25} 50%{opacity:0.55} }
      @keyframes po { 0%,100%{opacity:0.25} 50%{opacity:0.55} }
      @keyframes py { 0%,100%{opacity:0.20} 50%{opacity:0.50} }
    </style>
  </defs>

  <!-- Background -->
  <rect x="-20" y="-20" width="480" height="420" fill="url(#bg)" rx="10"/>

  <!-- Grid -->
  <g stroke="#ffffff07" stroke-width="1">
    <line x1="-20" y1="-20" x2="-20" y2="400"/><line x1="20" y1="-20" x2="20" y2="400"/>
    <line x1="60" y1="-20" x2="60" y2="400"/><line x1="100" y1="-20" x2="100" y2="400"/>
    <line x1="140" y1="-20" x2="140" y2="400"/><line x1="180" y1="-20" x2="180" y2="400"/>
    <line x1="220" y1="-20" x2="220" y2="400"/><line x1="260" y1="-20" x2="260" y2="400"/>
    <line x1="300" y1="-20" x2="300" y2="400"/><line x1="340" y1="-20" x2="340" y2="400"/>
    <line x1="380" y1="-20" x2="380" y2="400"/><line x1="420" y1="-20" x2="420" y2="400"/>
    <line x1="-20" y1="20" x2="460" y2="20"/><line x1="-20" y1="60" x2="460" y2="60"/>
    <line x1="-20" y1="100" x2="460" y2="100"/><line x1="-20" y1="140" x2="460" y2="140"/>
    <line x1="-20" y1="180" x2="460" y2="180"/><line x1="-20" y1="220" x2="460" y2="220"/>
    <line x1="-20" y1="260" x2="460" y2="260"/><line x1="-20" y1="300" x2="460" y2="300"/>
    <line x1="-20" y1="340" x2="460" y2="340"/><line x1="-20" y1="380" x2="460" y2="380"/>
  </g>

  <!-- Title -->
  <text x="220" y="15" text-anchor="middle" font-size="12.5" fill="#94a3b8" letter-spacing="0.6">
    3D VIEW — UPPER LINK BRIDGING TANGENTIAL OFFSET
  </text>

  <!-- Oblique axes at G (120,360):
       r̂ → right, ẑ → up, depth (t̂) → oblique upper-right at 30° -->
  <!-- ẑ axis -->
  <line x1="120" y1="360" x2="120" y2="80" stroke="#66aaff" stroke-width="1.2" opacity="0.35" filter="url(#glow-axis)"/>
  <line x1="120" y1="360" x2="120" y2="84" stroke="#66aaff" stroke-width="1.8" marker-end="url(#arr-axis)"/>
  <text x="126" y="70" font-size="15" fill="#93c5fd" font-style="italic">ẑ</text>

  <!-- r̂ axis -->
  <line x1="120" y1="360" x2="380" y2="360" stroke="#66aaff" stroke-width="1.2" opacity="0.35" filter="url(#glow-axis)"/>
  <line x1="120" y1="360" x2="376" y2="360" stroke="#66aaff" stroke-width="1.8" marker-end="url(#arr-axis)"/>
  <text x="382" y="364" font-size="15" fill="#93c5fd" font-style="italic">r&#x0302;&#x1D62;</text>

  <!-- t̂ axis (oblique, depth direction) -->
  <line x1="120" y1="360" x2="215" y2="305" stroke="#66aaff" stroke-width="1.2" opacity="0.35" filter="url(#glow-axis)"/>
  <line x1="120" y1="360" x2="211" y2="307" stroke="#66aaff" stroke-width="1.8" marker-end="url(#arr-axis)"/>
  <text x="216" y="300" font-size="15" fill="#93c5fd" font-style="italic">t&#x0302;&#x1D62;</text>

  <!-- Radial plane shading: the plane containing G, E, T_proj -->
  <!-- Corners: G(120,360), along r̂ far right (360,360), up to (360,105), back to (120,105) -->
  <rect x="120" y="105" width="240" height="255" fill="#38bdf808" stroke="#38bdf8"
        stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="310" y="128" font-size="11" fill="#38bdf8" opacity="0.55" font-style="italic">radial plane</text>

  <!-- G dot -->
  <circle cx="120" cy="360" r="14" fill="#38bdf8" opacity="0.1" filter="url(#glow-dot)"/>
  <circle cx="120" cy="360" r="6.5" fill="#38bdf8" class="pop pG"/>
  <text x="96" y="378" font-size="14" fill="#93c5fd" font-style="italic" class="lbl la">G&#x1D62;</text>

  <!-- Lower link L1 in radial plane: G(120,360) → E(196.6,295.7) -->
  <line x1="120" y1="360" x2="196.6" y2="295.7" stroke="#38bdf8" stroke-width="6"
        stroke-dasharray="120 120" stroke-dashoffset="120"
        filter="url(#glow-blue)" class="p1"/>
  <line x1="120" y1="360" x2="196.6" y2="295.7" stroke="#38bdf8" stroke-width="3"
        stroke-dasharray="120 120" stroke-dashoffset="120" class="dl1"/>
  <text x="140" y="316" font-size="13" fill="#38bdf8" font-style="italic" class="lbl lf">L&#x2081;</text>

  <!-- E dot -->
  <circle cx="196.6" cy="295.7" r="14" fill="#38bdf8" opacity="0.1" filter="url(#glow-dot)"/>
  <circle cx="196.6" cy="295.7" r="6" fill="#38bdf8" class="pop pE"/>
  <text x="204" y="290" font-size="13" fill="#93c5fd" font-style="italic" class="lbl lb">E&#x1D62;</text>
  <!-- ball-socket at E -->
  <circle cx="196.6" cy="295.7" r="9" fill="none" stroke="#475569" stroke-width="1.1" opacity="0.7"/>

  <!-- T_proj (projection of T onto radial plane): (174.6, 213.6) -->
  <!-- dashed upper link from E to T_proj (in radial plane) -->
  <line x1="196.6" y1="295.7" x2="174.6" y2="213.6" stroke="#fb923c" stroke-width="3"
        stroke-dasharray="4,3" class="dl2p" opacity="0.45"/>
  <circle cx="174.6" cy="213.6" r="5" fill="#fb923c" opacity="0.5" class="pop pTp"/>
  <text x="116" y="209" text-anchor="end" font-size="11.5" fill="#fb923c" font-style="italic" opacity="0.7" class="lbl lc">T&#x1D62; proj.</text>

  <!-- d_t,i offset line: from T_proj(174.6,213.6) to T_actual(222.2,186.1) -->
  <!-- This is the tangential offset going "into" oblique direction -->
  <line x1="174.6" y1="213.6" x2="222.2" y2="186.1" stroke="#facc15" stroke-width="5"
        stroke-dasharray="58 58" stroke-dashoffset="58"
        filter="url(#glow-yellow)" class="pdt" opacity="0.22"/>
  <line x1="174.6" y1="213.6" x2="222.2" y2="186.1" stroke="#facc15" stroke-width="2"
        stroke-dasharray="5,3" class="ddt"/>
  <!-- d_t,i label: placed perpendicular-right of the d_t line, above the line -->
  <text x="182" y="182" font-size="12" fill="#facc15" font-style="italic" class="lbl le">d&#x209C;,&#x1D62;</text>

  <!-- T actual dot -->
  <circle cx="222.2" cy="186.1" r="14" fill="#fb923c" opacity="0.1" filter="url(#glow-dot)"/>
  <circle cx="222.2" cy="186.1" r="6.5" fill="#fb923c" class="pop pT"/>
  <text x="233" y="172" font-size="13" fill="#fb923c" font-style="italic" class="lbl ld">T&#x1D62;</text>
  <!-- ball-socket at T -->
  <circle cx="222.2" cy="186.1" r="9" fill="none" stroke="#475569" stroke-width="1.1" opacity="0.7"/>

  <!-- Upper link L2: E → T actual -->
  <line x1="196.6" y1="295.7" x2="222.2" y2="186.1" stroke="#fb923c" stroke-width="6"
        stroke-dasharray="85 85" stroke-dashoffset="85"
        filter="url(#glow-orange)" class="p2" opacity="0.25"/>
  <line x1="196.6" y1="295.7" x2="222.2" y2="186.1" stroke="#fb923c" stroke-width="3"
        stroke-dasharray="85 85" stroke-dashoffset="85" class="dl2"/>
  <text x="252" y="242" font-size="13" fill="#fb923c" font-style="italic" class="lbl lc">L&#x2082;</text>

  <!-- Vertical dashed helper from T_proj to same height as T_actual -->
  <line x1="174.6" y1="213.6" x2="174.6" y2="185" stroke="#3d5068" stroke-width="0.8" stroke-dasharray="2,3"/>
  <!-- Horizontal dashed from T_proj height across -->
  <line x1="120" y1="213.6" x2="222.2" y2="213.6" stroke="#3d5068" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- Legend -->
  <g transform="translate(295,52)">
    <rect x="0" y="0" width="148" height="100" rx="5" fill="#0c1220" stroke="#2d3f55" stroke-width="1"/>
    <line x1="10" y1="20" x2="38" y2="20" stroke="#38bdf8" stroke-width="3" filter="url(#glow-blue)"/>
    <text x="44" y="24" font-size="11.5" fill="#38bdf8" font-style="italic">L&#x2081; — lower link</text>
    <line x1="10" y1="44" x2="38" y2="44" stroke="#fb923c" stroke-width="3" filter="url(#glow-orange)"/>
    <text x="44" y="48" font-size="11.5" fill="#fb923c" font-style="italic">L&#x2082; — upper link</text>
    <line x1="10" y1="68" x2="38" y2="68" stroke="#facc15" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="44" y="72" font-size="11.5" fill="#facc15" font-style="italic">d&#x209C;,&#x1D62; — tangential offset</text>
    <circle cx="22" cy="90" r="7" fill="none" stroke="#475569" stroke-width="1.1"/>
    <text x="34" y="94" font-size="11.5" fill="#64748b" font-style="italic">ball-socket joint</text>
  </g>

  <!-- Footer -->
  <text x="220" y="387" text-anchor="middle" font-size="12" fill="#7a9bbf" font-style="italic">
    Ball-socket at E allows L&#x2082; to bridge d&#x209C;,&#x1D62; &#x2014; lower link stays in radial plane
  </text>
</svg>
